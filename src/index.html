<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Stopwatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stopwatch">
    <h1>Stopwatch</h1>

    <div id="display" class="display">00:00:00</div>

    <div class="controls">
      <button id="start">Start</button>
      <button id="pause" disabled>Pause</button>
      <button id="lap" disabled>Lap</button>
      <button id="reset">Reset</button>
    </div>

    <ol id="laps" class="laps"></ol>
  </main>

  <section class="study-focus" aria-labelledby="study-focus-title">
    <h2 id="study-focus-title">Study Focus</h2>

    <div class="study-focus-settings">
      <label for="focus-duration">Study time (minutes)</label>
      <input id="focus-duration" type="number" min="1" step="1" value="25">

      <label for="break-duration">Break time (minutes)</label>
      <input id="break-duration" type="number" min="1" step="1" value="5">
    </div>

    <p id="focus-status" role="status">Ready to focus</p>
    <div id="focus-display" class="display" aria-live="off">25:00</div>

    <div class="controls">
      <button id="focus-start">Start focus</button>
      <button id="focus-pause" disabled>Pause</button>
      <button id="focus-reset">Reset</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
